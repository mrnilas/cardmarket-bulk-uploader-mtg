<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardmarket Bulk Uploader</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Cardmarket Bulk Uploader</h1>

      <label class="file">
        <span>ManaBox CSV</span>
        <input id="file" type="file" accept=".csv,text/csv" />
      </label>

      <p id="status" class="muted">No file imported yet.</p>

      <details id="issues" hidden>
        <summary id="issues-title"></summary>
        <ul id="issues-list"></ul>
      </details>

      <section id="import" hidden>
        <dl>
          <dt>Rows</dt><dd id="s-rows"></dd>
          <dt>Cards</dt><dd id="s-cards"></dd>
          <dt>Sets</dt><dd id="s-sets"></dd>
          <dt>Finish</dt><dd id="s-finish"></dd>
          <dt>Language</dt><dd id="s-lang"></dd>
        </dl>

        <h2>This run</h2>
        <label class="row">
          <span>Language to list</span>
          <select id="language"></select>
        </label>
        <p id="run-progress" class="muted"></p>

        <h2>Minimum price (€)</h2>
        <p class="muted">Price = Cardmarket trend, but never below:</p>
        <div class="prices">
          <label>Common <input id="min-common" type="number" min="0.02" step="0.01" /></label>
          <label>Uncommon <input id="min-uncommon" type="number" min="0.02" step="0.01" /></label>
          <label>Rare <input id="min-rare" type="number" min="0.02" step="0.01" /></label>
          <label>Mythic <input id="min-mythic" type="number" min="0.02" step="0.01" /></label>
        </div>

        <button id="open" type="button" class="primary">Open Cardmarket listing</button>
        <div class="actions">
          <button id="reset-progress" type="button">Reset progress</button>
          <button id="clear" type="button">Clear import</button>
        </div>
      </section>

      <footer class="expansions">
        <span id="expansion-status" class="muted"></span>
        <button id="expansion-refresh" type="button">Update</button>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
